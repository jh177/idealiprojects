<!-- /portfolio-live-entertainment/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/images/ideali-favicon.png" />
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/tw-setup.js"></script>
  <title>Live Entertainment — Ideali Projects</title>
  <meta name="description"
    content="Live Events — concerts, touring, venue partnerships, international productions. Showcase coming soon." />
</head>

<body class="bg-[var(--surface)]">
  <!-- HEADER -->
  <div data-include="/partials/header.html"></div>

  <main id="content-wrapper">
    <section class="pt-[calc(var(--header-h)+56px)] md:pt-0 pb-16 bg-[var(--surface)]">
      <div class="mx-auto px-6 md:px-10 xl:px-16">
        <div class="projects-story">

          <!-- LEFT: title/desc -->
          <div class="projects-story__intro">
            <div>
              <h1 class="font-display text-3xl md:text-4xl lg:text-5xl tracking-tight text-brand">
                Live Entertainment
              </h1>
              <p class="mt-4 text-base md:text-lg text-gray-700 max-w-sm">
                Concerts, touring, venue partnerships, international&nbsp;productions.
              </p>
            </div>
          </div>

          <!-- RIGHT: highlight reel, full column width -->
          <div class="live-highlight">
            <div class="live-highlight__video">
              <iframe src="https://player.vimeo.com/video/1189550809?badge=0&autopause=0&title=0&byline=0&portrait=0&dnt=1"
                frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                title="GAI 2026 Las Vegas Highlights"></iframe>
            </div>

            <figure class="live-highlight__poster">
              <img src="/images/live-entertainment/GAI-dolby live-2026.jpg" alt="GAI — Dolby Live 2026 poster">
            </figure>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <div data-include="/partials/footer.html"></div>

  <!-- Partials + interactions -->
  <script type="module">
    import { includePartials } from "/src/partials.js";
    import { initSite } from "/src/main.js";
    includePartials().then(initSite);
  </script>
</body>

</html>
